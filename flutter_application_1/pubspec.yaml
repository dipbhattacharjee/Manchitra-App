name: manchitra
description: "Manchitra — Durga Puja 2026 Pandal Navigation & Discovery App"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Google Fonts — Playfair Display (headlines) + Nunito Sans (body)
  google_fonts: ^6.2.1
  supabase_flutter: ^2.16.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  google_sign_in: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  flutter_map_marker_cluster: ^8.2.2
  permission_handler: ^11.3.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  rename: ^3.1.0

flutter:
  uses-material-design: true

  # Note: Fonts are loaded via google_fonts package at runtime.
  # If you want to bundle fonts locally (recommended for production),
  # download the font files and declare them here:
  #
  # fonts:
  #   - family: PlayfairDisplay
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-Regular.ttf
  #       - asset: assets/fonts/PlayfairDisplay-Bold.ttf
  #         weight: 700
  #   - family: NunitoSans
  #     fonts:
  #       - asset: assets/fonts/NunitoSans-Regular.ttf
  #       - asset: assets/fonts/NunitoSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NunitoSans-Bold.ttf
  #         weight: 700
